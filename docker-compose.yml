# Reading SMART data and talking to /dev/ipmi0 needs a privileged container.
# For a remote BMC only (no disks), drop `privileged` and the devices.
services:
  fan-control:
    build: .
    container_name: fan-control
    restart: unless-stopped
    privileged: true
    environment:
      # Owner of the files in ./data (run `id` on the host to find yours)
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      # false = run as PUID/PGID: only with a remote BMC and disk monitoring disabled
      - RUN_AS_ROOT=true
    volumes:
      - ./data:/data
      - /dev:/dev
    ports:
      - "9495:9495"
