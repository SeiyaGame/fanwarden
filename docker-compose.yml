services:
  fan-control:
    # Pin a version (e.g. :1.2.0) to choose when to upgrade; :latest follows releases.
    image: ghcr.io/seiyagame/fan_control_supermicro:latest
    container_name: fan-control
    restart: unless-stopped

    # Simple mode: runs as root in a privileged container with the host /dev, so the BMC
    # and every disk are found without configuration. For a container without `privileged`
    # running as PUID/PGID, see "Hardened mode" in the README.
    privileged: true

    environment:
      # Owner of the files in ./data (run `id` on the host to find yours)
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      # false = hardened mode (README)
      - RUN_AS_ROOT=true
      # More details in the logs: fan_control=debug
      - RUST_LOG=fan_control=info

    volumes:
      - ./data:/data # config.toml and history.db
      - /dev:/dev

    ports:
      - "9495:9495" # web UI and /metrics

    # On stop the fans are handed back to the BMC: leave it time to send the command.
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
