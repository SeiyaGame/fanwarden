# Release notes generated from the conventional commits (git-cliff, used by the CI).
#   git cliff --latest      notes of the last tag
#   git cliff --unreleased  what the next release will contain

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/SeiyaGame/fanwarden/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
{% if previous.version and version %}
**Full changelog**: https://github.com/SeiyaGame/fanwarden/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 5 -->Build and CI" },
  { message = '^chore\(release\)', skip = true },
  { message = ".*", group = "<!-- 6 -->Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
