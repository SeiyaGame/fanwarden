[package]
name = "fanwarden"
version = "0.2.0"
edition = "2024"
description = "Fan control for Supermicro motherboards through IPMI, with a web UI"
license = "GPL-3.0-only"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
