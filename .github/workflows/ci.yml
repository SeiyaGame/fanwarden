name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Weekly run: new clippy lints of the latest stable, new security advisories
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its previous run; runs on main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs (Dependabot included) reuse the cache of main without adding their own
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    # rust-version in Cargo.toml: catches a dependency update that requires a newer Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-targets --locked

  deny:
    # Licenses, banned or duplicated crates, unknown sources (deny.toml)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  advisories:
    # Not required by "CI ok": an advisory published today must not block unrelated PRs.
    # The weekly run reports them, and Dependabot opens the security updates.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  docker:
    # PRs only build the image (Dockerfile and base image updates are tested).
    # ghcr.io: :dev for every push to main, :X.Y.Z, :X.Y and :latest for v* tags.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: rust
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FANWARDEN_BUILD=${{ github.ref == 'refs/heads/main' && format('dev {0}', github.sha) || '' }}
          cache-from: type=gha
          # Only main and tags write the cache, PRs read it
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

  # Single check to require in the branch rules of main (and for Dependabot auto-merge)
  ci-ok:
    name: CI ok
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [workflows, web, rust, msrv, deny, docker]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed or were skipped"

  # v* tags: the GitHub release. main: the "dev" pre-release, replaced on every push, to try the
  # next version before releasing it.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [rust, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog needs the history and the previous tags
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: |
          # The dev pre-release shows its commit in the web UI
          if [ "$GITHUB_REF" = refs/heads/main ]; then export FANWARDEN_BUILD="dev ${GITHUB_SHA::7}"; fi
          cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: |
          cp target/x86_64-unknown-linux-musl/release/fanwarden fanwarden-x86_64-linux
          sha256sum fanwarden-x86_64-linux > fanwarden-x86_64-linux.sha256
      - name: Changelog since the previous tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            fanwarden-x86_64-linux
            fanwarden-x86_64-linux.sha256
          body_path: RELEASE_NOTES.md
      - name: Changes since the last release
        if: github.ref == 'refs/heads/main'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Replace the dev pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --cleanup-tag --yes
          fi
          gh release create dev fanwarden-x86_64-linux fanwarden-x86_64-linux.sha256             --prerelease --target "$GITHUB_SHA" --title "dev ($(git rev-parse --short HEAD))"             --notes-file RELEASE_NOTES.md
